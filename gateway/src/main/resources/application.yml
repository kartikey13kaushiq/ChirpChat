server:
  port: ${PORT:8080}
  shutdown: graceful
spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth
              uri: ${AUTH_SERVICE_URL:http://localhost:9000}
              predicates:
                - Path=/auth/**,/.well-known/**
            - id: chat-websocket
              uri: ${CHAT_SERVICE_WS_URL:ws://localhost:9100}
              predicates:
                - Path=/ws/**
            - id: chat
              uri: ${CHAT_SERVICE_URL:http://localhost:9100}
              predicates:
                - Path=/api/**
          default-filters:
            - AddResponseHeader=X-Content-Type-Options, nosniff
            - AddResponseHeader=Referrer-Policy, no-referrer
management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      probes:
        enabled: true
    gateway:
      access: read_only
