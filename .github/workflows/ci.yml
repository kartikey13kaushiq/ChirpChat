name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Unit and integration tests for every service; PostgreSQL comes from Testcontainers.
      - run: ./mvnw -B verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: "*/target/site/jacoco/"

  e2e:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Start the stack
        run: docker compose up -d --build
      - name: Wait until both services answer through the gateway
        run: |
          for i in $(seq 1 90); do
            auth=$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/.well-known/jwks.json || true)
            chat=$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/api/channels || true)
            if [ "$auth" = 200 ] && [ "$chat" = 401 ]; then echo "ready after $((i * 2))s"; exit 0; fi
            sleep 2
          done
          echo "services did not become ready"; docker compose logs; exit 1
      - name: Smoke test through the gateway
        run: ./scripts/smoke.sh http://localhost:8080
      - name: Logs on failure
        if: failure()
        run: docker compose logs
